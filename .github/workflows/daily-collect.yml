# Daily unattended collection. Replaces running scripts/run.bat at laptop login,
# which was unreliable because wifi is often not up yet at boot.
#
# NOTE ON THE 60-DAY TIMER: GitHub disables scheduled workflows after 60 days of
# repository inactivity, and pushes made with GITHUB_TOKEN do not reset that timer.
# You get a warning email first; a manual "Run workflow" click re-arms it.
name: Daily flight price collection

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Bangkok
    - cron: '0 1 * * *'
  workflow_dispatch:

# Never let two collections race for the same day's raw file.
concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Collect real prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::TRAVELPAYOUTS_TOKEN secret is not set."
            exit 1
          fi
          # Travelpayouts occasionally 5xx's on a single route; retry the whole
          # collection rather than shipping a half-empty snapshot.
          ok=0
          for attempt in 1 2 3; do
            if python scripts/collector.py --real; then ok=1; break; fi
            echo "::warning::Collection attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Collection failed after 3 attempts."
            exit 1
          fi

      - name: Rebuild dashboard data
        run: python scripts/pipeline.py

      - name: Commit new data
        run: |
          git config user.name  "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: daily collection $(date -u +%Y-%m-%d)"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Collection run $(date -u +%Y-%m-%d)"
            echo ''
            echo '```'
            tail -n 5 data/processed/price_change_log.csv 2>/dev/null || echo 'no change log yet'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
